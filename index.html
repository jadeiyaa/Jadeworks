const collections=Object.fromEntries(Object.entries(window.PORTFOLIO_MEDIA).map(([k,items])=>[k,items.map(x=>({...x,img:x.image}))]));data.art=collections.VFX;const initialProject=data.art.length?Math.floor(Math.random()*data.art.length):0;const positions={VFX:initialProject,Models:0,Misc:0};let N=data.art.length;const wrap=n=>(n%N+N)%N,design={snap:1,grow:1.065,watermark:true};let position=initialProject,target=position,velocity=0,frame=0,lastTime=0,selected=initialProject,category='VFX',view='work',drag=null,moved=false,growTimer,wheelSum=0,lastWheel=0,lastStep=0,categoryToken=0,mediaToken=0,mode='image',playing=true,videoTime=0;
const motion=(el,keys,opts={})=>reduced.matches?Promise.resolve():el.animate(keys,{duration:230,easing:'cubic-bezier(.2,.8,.2,1)',...opts}).finished.catch(()=>{});
// Rasterize once and share the tile: no animated grid of outlined text nodes.
function makeWatermarkTile(){
 const canvas=document.createElement('canvas'),ratio=Math.min(devicePixelRatio||1,2);
 canvas.width=180*ratio;canvas.height=78*ratio;
 const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);
 ctx.font='500 15px "Josefin Sans", sans-serif';ctx.textBaseline='middle';
 ctx.lineWidth=.45;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText('@johnmasterxx',0,39);
 ctx.fillStyle='#e2f3e9';ctx.fillText('@johnmasterxx',0,39);
 root.style.setProperty('--watermark-tile','url("'+canvas.toDataURL()+'")');
}
function watermark(el){const stream=document.createElement('div');stream.className='watermark-tile';el.append(stream);}
makeWatermarkTile();document.fonts.ready.then(makeWatermarkTile);
let cards=[];function buildCards(){qa('[data-category]').forEach(b=>{let count=b.querySelector('span');if(!count){count=document.createElement('span');b.append(' ',count);}count.textContent=collections[b.dataset.category].length;});ring.replaceChildren();cards=data.art.map((item,i)=>{const b=document.createElement('button');b.className='creation cursor-interaction';b.setAttribute('aria-label',item.name+' — select creation');b.innerHTML='<span class="creation-inner"><img draggable="false" alt=""><span class="watermarks" aria-hidden="true"></span><span class="creation-label"></span></span>';b.querySelector('img').src=item.img;b.querySelector('img').alt=item.name+' VFX';b.querySelector('.creation-label').textContent=item.name;watermark(b.querySelector('.watermarks'));b.addEventListener('click',()=>{if(moved)return;if(i===selected&&Math.abs(position-target)<.05)openDetail();else go(Math.round(target)+wrap(i-wrap(Math.round(target))+N/2)-N/2);});ring.append(b);return b;});q('.carousel-dots').replaceChildren(...data.art.map(()=>document.createElement('span')));applyDesign();}watermark(q('.still-layer .watermarks'));
function clearGrow(){ring.classList.remove('is-settled');clearTimeout(growTimer);cards.forEach(c=>c.classList.remove('focus-grow'));}
function queueGrow(){clearTimeout(growTimer);growTimer=setTimeout(()=>{if(!drag&&N>0&&view==='work'&&q('.detail').hidden){cards[selected].classList.add('focus-grow');ring.classList.add('is-settled');}},550);}
function paint(){if(N){const live=wrap(Math.round(position));qa('.carousel-dots span').forEach((d,i)=>d.classList.toggle('active',i===live));q('.carousel-dots').setAttribute('aria-label','Creation '+(live+1)+' of '+N);}const w=gallery.clientWidth;cards.forEach((card,i)=>{const d=wrap(i-position+N/2)-N/2,a=Math.abs(d),visible=a<3.8;if(!visible){if(!card.inert){card.style.visibility='hidden';card.inert=true;}return;}const x=Math.sign(d)*(a<=1?a*.235:.235+(a-1)*.103)*w;const z=-a*70,scale=1-Math.min(a,4)*.105;card.style.transform=`translateX(-50%) translateX(${x}px) translateZ(${z}px) rotateY(${-Math.sign(d)*Math.min(a,3)*17}deg) scale(${scale})`;card.style.visibility=visible?'visible':'hidden';card.inert=!visible;card.style.opacity=String(a<3.1?1:Math.max(0,(3.8-a)/.7));card.style.zIndex=String(30-Math.round(a*5));card.setAttribute('aria-pressed',i===selected?'true':'false');});}
function announce(){if(!N)return;selected=wrap(Math.round(target));q('.project-name').textContent=data.art[selected].name;q('.count').textContent=String(selected+1).padStart(2,'0')+' — '+N;q('.current-category').textContent=category;}
let fastWheelUntil=0;function dismissScrollHint(){q('.first-scroll-hint').classList.add('dismissed');}
function tick(time){const dt=Math.min((time-lastTime)/1000||.016,.025);lastTime=time;if(time<fastWheelUntil){position+=(target-position)*(1-Math.exp(-dt/0.022));velocity=0;}else{velocity+=(420*design.snap*(target-position)-28*Math.sqrt(design.snap)*velocity)*dt;position+=velocity*dt;}paint();if(Math.abs(target-position)>.001||Math.abs(velocity)>.008){frame=requestAnimationFrame(tick);}else{position=target;velocity=0;frame=0;paint();if(!drag)queueGrow();}}
function start(){if(reduced.matches){position=target;velocity=0;paint();if(!drag)queueGrow();return;}if(!frame){lastTime=performance.now();frame=requestAnimationFrame(tick);}}
function go(n){if(!N||switching)return;clearGrow();target=n;announce();start();}
q('.previous').onclick=()=>go(Math.round(target)-1);q('.next').onclick=()=>go(Math.round(target)+1);
let wheelIdle;let switching=false,wheelState={last:0,mag:0,sign:0,total:0,used:false,step:0,rising:0};
q('.browse').addEventListener('wheel',e=>{if(!N||switching||e.ctrlKey||!q('.detail').hidden)return;e.preventDefault();e.stopPropagation();const raw=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;if(!raw)return;const units=e.deltaMode===1?raw/3:e.deltaMode===2?raw*3:raw/80;const delta=Math.max(-3,Math.min(3,units));const sign=Math.sign(delta);if(wheelState.sign&&sign!==wheelState.sign)target=position;wheelState.sign=sign;clearGrow();target+=delta;position+=(target-position)*.65;velocity=0;fastWheelUntil=performance.now()+350;announce();paint();start();if(Math.abs(delta)>.02)dismissScrollHint();clearTimeout(wheelIdle);wheelIdle=setTimeout(()=>{fastWheelUntil=performance.now()+200;go(Math.round(target));},100);},{passive:false});
gallery.addEventListener('pointerdown',e=>{if(!N||switching||e.button!==0)return;clearTimeout(wheelIdle);clearGrow();moved=false;drag={x:e.clientX,base:position,id:e.pointerId};});
gallery.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6){moved=true;gallery.setPointerCapture(e.pointerId);target=drag.base-dx/Math.max(95,gallery.clientWidth*.18);start();}});
function release(){if(!drag)return;if(moved&&Math.abs(target-drag.base)>.4)dismissScrollHint();drag=null;go(Math.round(target));setTimeout(()=>{moved=false;},60);}gallery.addEventListener('pointerup',release);gallery.addEventListener('pointercancel',release);gallery.addEventListener('lostpointercapture',release);
gallery.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();go(Math.round(target)+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1));}});
function tabIndicator(){const b=q('[data-category][aria-pressed="true"]');q('.tab-line').style.width=b.offsetWidth+'px';q('.tab-line').style.transform='translateX('+b.offsetLeft+'px)';}
qa('[data-category]').forEach(b=>b.onclick=async()=>{if(category===b.dataset.category&&!switching)return;const token=++categoryToken;clearTimeout(wheelIdle);clearGrow();positions[category]=Math.round(target);switching=true;cancelAnimationFrame(frame);frame=0;velocity=0;const next=b.dataset.category;qa('[data-category]').forEach(x=>x.setAttribute('aria-pressed',x===b));tabIndicator();const out=ring.hidden?q('.empty'):ring;out.getAnimations().forEach(a=>a.cancel());await motion(out,[{transform:'translateY(0)',opacity:1},{transform:'translateY(340px)',opacity:0}],{duration:270,easing:'cubic-bezier(.4,0,.7,1)'});if(token!==categoryToken)return;category=next;data.art=collections[category];N=data.art.length;position=target=positions[category]||0;selected=N?wrap(Math.round(target)):0;buildCards();tabIndicator();q('.browse h1').textContent={VFX:'Visual Effects',Models:'Modelling',Misc:'Miscellaneous'}[category];const empty=!N;ring.hidden=empty;q('.empty').hidden=!empty;q('.carousel-dots').hidden=empty;q('.gallery-bottom').hidden=empty;announce();paint();const incoming=empty?q('.empty'):ring;await motion(incoming,[{transform:'translateY(340px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:340,easing:'cubic-bezier(.16,.85,.25,1)'});if(token!==categoryToken)return;switching=false;wheelState.used=false;wheelState.last=0;if(N)queueGrow();});
function mediaSize(m){const space=q('.media-space'),img=cards[selected].querySelector('img'),v=q('.actual-video');const ratio=m==='video'?(v.videoWidth/v.videoHeight||16/9):(img.naturalWidth/img.naturalHeight||.8);const h=Math.max(1,Math.min(space.clientHeight,space.clientWidth/ratio));return {w:h*ratio,h};}
function setSize(m){const s=mediaSize(m);q('.media-frame').style.width=s.w+'px';q('.media-frame').style.height=s.h+'px';}
function openDetail(){root.classList.add('detail-active');clearGrow();mode='image';mediaToken++;q('.browse').hidden=true;q('.detail').hidden=false;const img=q('.detail-image');img.src=data.art[selected].img;img.alt=data.art[selected].name;img.onload=()=>{if(mode==='image')setSize('image');};q('.detail-caption h2').textContent=data.art[selected].name;q('.still-layer').hidden=false;q('.video-layer').hidden=true;q('.still-layer').style.opacity='1';q('.video-layer').style.opacity='1';q('.media-note').textContent='image preview';qa('[data-media]').forEach(b=>{b.disabled=false;b.setAttribute('aria-pressed',b.dataset.media==='image');});setSize('image');motion(q('.media-frame'),[{transform:'translateY(28px) scale(.88)'},{transform:'translateY(0) scale(1)'}],{duration:260});q('.back').focus();}
function closeDetail(){q('.actual-video').pause();root.classList.remove('detail-active');mediaToken++;q('.detail').hidden=true;q('.browse').hidden=false;mode='image';motion(q('.browse'),[{transform:'translateY(-12px)'},{transform:'translateY(0)'}],{duration:190});queueGrow();q('.open-project').focus();}
q('.open-project').onclick=openDetail;q('.back').onclick=closeDetail;root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!q('.detail').hidden)closeDetail();});
qa('[data-media]').forEach(b=>b.onclick=async()=>{if(mode===b.dataset.media)return;const token=++mediaToken,next=b.dataset.media;qa('[data-media]').forEach(x=>x.disabled=true);const old=q(mode==='image'?'.still-layer':'.video-layer');await motion(old,[{opacity:1},{opacity:0}],{duration:110});if(token!==mediaToken)return;old.hidden=true;const box=q('.media-frame'),from={width:box.offsetWidth+'px',height:box.offsetHeight+'px'},sz=mediaSize(next);mode=next;box.style.width=sz.w+'px';box.style.height=sz.h+'px';await motion(box,[from,{width:sz.w+'px',height:sz.h+'px'}],{duration:250});if(token!==mediaToken)return;const fresh=q(mode==='image'?'.still-layer':'.video-layer');fresh.hidden=false;if(mode==='video'){const video=q('.actual-video'),source=data.art[selected].video;video.hidden=!source;q('.coming-video').hidden=!!source;if(source){video.src=source;video.onloadedmetadata=()=>setSize('video');}}else q('.actual-video').pause();q('.media-note').textContent=mode==='video'?'video preview':'image preview';qa('[data-media]').forEach(x=>{x.disabled=false;x.setAttribute('aria-pressed',x.dataset.media===mode);});motion(fresh,[{opacity:0},{opacity:1}],{duration:120});});
let treeIntroduced=false;const inviteTimers=[];
function stopInvite(){inviteTimers.forEach(clearTimeout);inviteTimers.length=0;qa('.tree-nav button').forEach(b=>b.classList.remove('tree-invite'));}
function inviteTree(){if(treeIntroduced)return;treeIntroduced=true;if(reduced.matches)return;qa('.tree-nav button').forEach((b,i)=>{inviteTimers.push(setTimeout(()=>b.classList.add('tree-invite'),350+i*600));inviteTimers.push(setTimeout(()=>b.classList.remove('tree-invite'),1150+i*600));});}
q('.tree-nav').addEventListener('pointerdown',stopInvite);q('.tree-nav').addEventListener('keydown',stopInvite);
qa('[data-view]').forEach(b=>b.onclick=()=>{if(view===b.dataset.view)return;view=b.dataset.view;const work=view==='work';if(!work)q('.actual-video').pause();root.classList.toggle('detail-active',work&&!q('.detail').hidden);root.classList.toggle('commission-active',!work);if(!work)inviteTree();else stopInvite();q('.work-view').hidden=!work;q('.commission-view').hidden=work;qa('header nav button').forEach(n=>n.setAttribute('aria-pressed',n.dataset.view===view));motion(q(work?'.work-view':'.commission-view'),[{transform:'translateY(18px) scale(.992)'},{transform:'translateY(0) scale(1)'}],{duration:280});});
const tiers=[{name:'Simple',sub:'Small sparks, big character.',usd:['$2–15','$5–20'],robux:['500–3,000','1,300–5,200'],features:['Simple emits & small particles','Atmospheres','No modelling included']},{name:'Advanced',sub:'A little more magic.',usd:['$20–80','$30–100'],robux:['5,200–21,000','8,000–25,000'],features:['Small auras & emitter sequences','Some modelling if needed','Extra touchups']},{name:'Complex',sub:'Room to go all out.',usd:['$100+','$130+'],robux:['25,000+','33,000+'],features:['Big auras, cutscenes & map atmospheres','Modelling if needed','Extra touchups']}];
let priceCategory='VFX',priceProcess='Normal',priceVersion=0;
function showInfo(name){q('.info-content').hidden=false;q('.info-content h2').textContent=name;qa('[data-info]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.info===name));q('.info-content').classList.toggle('pricing-page',name==='Pricing');const body=q('.info-body');if(name!=='Pricing'){body.innerHTML=data.info[name];return;}
body.innerHTML='<div class="price-switches"><div class="segmented" aria-label="Pricing category"><span class="segment-thumb"></span><button data-price-category="VFX">VFX</button><button data-price-category="Models">Models</button></div><div class="segmented process" aria-label="Creation process"><span class="segment-thumb"></span><button data-process="Normal">Normal</button><button data-process="Extra Revisions">Extra revisions</button></div></div><div class="plans-stage"><div class="plans"></div></div><ul class="scripting-note"><li>need <strong>scripted</strong> effects? can do! feel free to inquire!</li><li>you <strong>ONLY</strong> have to pay tax if you pay with robux (roblox tax). $USD payments are as stated.</li></ul><ul class="payment-note"><li>i accept <strong>Paypal/Venmo</strong> for $USD payments or robux <strong>AT THE DEV-EX EQUIVALENT</strong></li><li>10,000 robux = $38 USD.</li></ul>';
const updateControls=()=>{qa('[data-price-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.priceCategory===priceCategory));qa('[data-process]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.process===priceProcess));qa('.segmented').forEach(group=>{const b=group.querySelector('[aria-pressed="true"]');const thumb=group.querySelector('.segment-thumb');thumb.style.width=b.offsetWidth+'px';thumb.style.transform='translateX('+(b.offsetLeft-4)+'px)';});};
const draw=()=>{const extra=priceProcess!=='Normal';q('.plans').innerHTML=priceCategory==='Models'?'<div class="price-empty"><h3>Coming soon :)</h3><p>Model commissions will have their own prices here.</p></div>':tiers.map((t,i)=>'<section class="plan"><h3>'+t.name+'</h3><div class="plan-price">'+t.usd[extra?1:0]+'<small>USD</small></div><p class="robux-price">'+t.robux[extra?1:0]+' Robux <span>+ 30% tax</span></p><ul>'+t.features.map(f=>'<li>'+f+'</li>').join('')+'</ul><span class="plan-process">'+(extra?'Extra revisions':'Standard process')+'</span></section>').join('');};
const change=async()=>{const version=++priceVersion;updateControls();const stage=q('.plans');stage.getAnimations().forEach(a=>a.cancel());await motion(stage,[{transform:'translateY(0)'},{transform:'translateY(3px)'}],{duration:90});if(version!==priceVersion||!q('.plans'))return;draw();qa('.plan,.price-empty').forEach((card,i)=>motion(card,[{transform:'translateY(5px)'},{transform:'translateY(0)'}],{duration:190}));};
qa('[data-price-category]').forEach(b=>b.onclick=()=>{if(priceCategory===b.dataset.priceCategory)return;priceCategory=b.dataset.priceCategory;change();});qa('[data-process]').forEach(b=>b.onclick=()=>{if(priceProcess===b.dataset.process)return;priceProcess=b.dataset.process;change();});draw();updateControls();qa('.price-switches button').forEach(b=>b.classList.add('cursor-interaction'));
}

qa('[data-info]').forEach(b=>b.onclick=()=>{showInfo(b.dataset.info);priceVersion++;motion(q('.info-content'),[{transform:'translateY(5px)'},{transform:'translateY(0)'}],{duration:190});});
buildCards();qa('button').forEach(b=>b.classList.add('cursor-interaction'));new ResizeObserver(()=>{paint();tabIndicator();qa('.segmented').forEach(group=>{const b=group.querySelector('[aria-pressed="true"]'),thumb=group.querySelector('.segment-thumb');if(b&&thumb){thumb.style.width=b.offsetWidth+'px';thumb.style.transform='translateX('+(b.offsetLeft-4)+'px)';}});if(!q('.detail').hidden)setSize(mode);}).observe(root);new ResizeObserver(paint).observe(gallery);new ResizeObserver(()=>{if(!q('.detail').hidden)setSize(mode);}).observe(q('.media-space'));announce();paint();tabIndicator();queueGrow();
function applyDesign(){root.style.setProperty('--focus-grow',design.grow);qa('.watermarks').forEach(el=>el.hidden=!design.watermark);}
applyDesign();
root.addEventListener('contextmenu',e=>{if(e.target.closest('img,video,.creation,.media-frame'))e.preventDefault();});
root.addEventListener('dragstart',e=>{if(e.target.closest('img,video,.creation,.media-frame'))e.preventDefault();});
q('.actual-video').addEventListener('error',()=>{q('.actual-video').hidden=true;q('.coming-video').hidden=false;});

// Local launcher scans the folders; static hosting uses the generated manifest.
let mediaFingerprint=JSON.stringify(window.PORTFOLIO_MEDIA),checkingMedia=false;
async function syncLocalMedia(){
 if(checkingMedia||document.hidden||drag||switching||!q('.detail').hidden)return;
 checkingMedia=true;
 try{
  const response=await fetch('/__portfolio_media',{cache:'no-store'});
  if(!response.ok)return;
  const next=await response.json(),fingerprint=JSON.stringify(next);
  if(fingerprint===mediaFingerprint)return;
  const current=data.art[selected]?.image;
  clearTimeout(wheelIdle);clearGrow();cancelAnimationFrame(frame);frame=0;velocity=0;
  for(const key of Object.keys(collections))collections[key]=(next[key]||[]).map(x=>({...x,img:x.image}));
  window.PORTFOLIO_MEDIA=next;mediaFingerprint=fingerprint;
  data.art=collections[category];N=data.art.length;
  const kept=data.art.findIndex(x=>x.image===current);
  position=target=selected=kept>=0?kept:0;positions[category]=selected;
  buildCards();ring.hidden=!N;q('.empty').hidden=!!N;q('.carousel-dots').hidden=!N;q('.gallery-bottom').hidden=!N;
  announce();paint();tabIndicator();if(N)queueGrow();
 }catch(error){/* Keep the existing gallery if the local server is stopped. */}
 finally{checkingMedia=false;}
}
if(location.protocol==='http:'&&['127.0.0.1','localhost'].includes(location.hostname)){
 setInterval(syncLocalMedia,1500);window.addEventListener('focus',syncLocalMedia);
}

// One entrance per page load; inert blocks mouse and keyboard activation.
root.inert=true;root.classList.add('is-starting');
const entrance=[q('header'),q('.browse>.heading'),q('.category-bar'),q('.ring'),q('.carousel-dots'),q('.gallery-bottom'),q('.first-scroll-hint')];
if(!reduced.matches)entrance.forEach((el,i)=>el.animate([{transform:'translateY('+ (i===0?-22:32)+'px)'},{transform:'translateY(0)'}],{duration:1000-i*40,delay:i*40,easing:'cubic-bezier(.16,.8,.2,1)',fill:'backwards'}));
setTimeout(()=>{root.inert=false;root.classList.remove('is-starting');},1000);
})();
